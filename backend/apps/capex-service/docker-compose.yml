networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_capex_postgres_data:
    name: agiliz_capex_postgres_data

services:
  # Database-per-service: this Postgres belongs to capex-service alone. No other
  # service reads these tables.
  capex-postgres:
    image: postgres:16-alpine
    container_name: agiliz-capex-postgres
    environment:
      POSTGRES_USER: ${CAPEX_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${CAPEX_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${CAPEX_POSTGRES_DB:-capex}
    ports:
      - "${CAPEX_POSTGRES_HOST_PORT:-5445}:5432"
    volumes:
      - agiliz_capex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAPEX_POSTGRES_USER:-agiliz} -d ${CAPEX_POSTGRES_DB:-capex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  capex-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/capex-service/Dockerfile
      target: dev
    container_name: agiliz-capex-dev
    depends_on:
      capex-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${CAPEX_POSTGRES_USER:-agiliz}:${CAPEX_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-capex-postgres:5432/${CAPEX_POSTGRES_DB:-capex}
      PORT: 3000
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  capex-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/capex-service/Dockerfile
      target: runtime
    container_name: agiliz-capex-prod
    depends_on:
      capex-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${CAPEX_POSTGRES_USER:-agiliz}:${CAPEX_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-capex-postgres:5432/${CAPEX_POSTGRES_DB:-capex}
      PORT: 3000
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
