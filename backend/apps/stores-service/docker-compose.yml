networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_stores_postgres_data:
    name: agiliz_stores_postgres_data

services:
  # Database-per-service: this Postgres belongs to stores-service alone. No other
  # service reads these tables.
  stores-postgres:
    image: postgres:16-alpine
    container_name: agiliz-stores-postgres
    environment:
      POSTGRES_USER: ${STORES_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${STORES_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${STORES_POSTGRES_DB:-stores}
    ports:
      - "${STORES_POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - agiliz_stores_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORES_POSTGRES_USER:-agiliz} -d ${STORES_POSTGRES_DB:-stores}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  stores-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/stores-service/Dockerfile
      target: dev
    container_name: agiliz-stores-dev
    depends_on:
      stores-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${STORES_POSTGRES_USER:-agiliz}:${STORES_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-stores-postgres:5432/${STORES_POSTGRES_DB:-stores}
      PORT: 3000
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  stores-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/stores-service/Dockerfile
      target: runtime
    container_name: agiliz-stores-prod
    depends_on:
      stores-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${STORES_POSTGRES_USER:-agiliz}:${STORES_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-stores-postgres:5432/${STORES_POSTGRES_DB:-stores}
      PORT: 3000
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
