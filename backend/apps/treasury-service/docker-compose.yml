networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_treasury_postgres_data:
    name: agiliz_treasury_postgres_data

services:
  # Database-per-service: this Postgres belongs to treasury-service alone. No other
  # service reads these tables.
  treasury-postgres:
    image: postgres:16-alpine
    container_name: agiliz-treasury-postgres
    environment:
      POSTGRES_USER: ${TREASURY_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${TREASURY_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${TREASURY_POSTGRES_DB:-treasury}
    ports:
      - "${TREASURY_POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - agiliz_treasury_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TREASURY_POSTGRES_USER:-agiliz} -d ${TREASURY_POSTGRES_DB:-treasury}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  treasury-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/treasury-service/Dockerfile
      target: dev
    container_name: agiliz-treasury-dev
    depends_on:
      treasury-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${TREASURY_POSTGRES_USER:-agiliz}:${TREASURY_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-treasury-postgres:5432/${TREASURY_POSTGRES_DB:-treasury}
      PORT: 3000
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  treasury-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/treasury-service/Dockerfile
      target: runtime
    container_name: agiliz-treasury-prod
    depends_on:
      treasury-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${TREASURY_POSTGRES_USER:-agiliz}:${TREASURY_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-treasury-postgres:5432/${TREASURY_POSTGRES_DB:-treasury}
      PORT: 3000
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
