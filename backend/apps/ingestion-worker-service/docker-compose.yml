networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_ingestion_postgres_data:
    name: agiliz_ingestion_postgres_data

services:
  # Database-per-service: this Postgres belongs to ingestion-worker-service alone. No other
  # service reads these tables.
  ingestion-postgres:
    image: postgres:16-alpine
    container_name: agiliz-ingestion-postgres
    environment:
      POSTGRES_USER: ${INGESTION_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${INGESTION_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${INGESTION_POSTGRES_DB:-ingestion}
    ports:
      - "${INGESTION_POSTGRES_HOST_PORT:-5438}:5432"
    volumes:
      - agiliz_ingestion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INGESTION_POSTGRES_USER:-agiliz} -d ${INGESTION_POSTGRES_DB:-ingestion}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  ingestion-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/ingestion-worker-service/Dockerfile
      target: dev
    container_name: agiliz-ingestion-dev
    depends_on:
      ingestion-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${INGESTION_POSTGRES_USER:-agiliz}:${INGESTION_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-ingestion-postgres:5432/${INGESTION_POSTGRES_DB:-ingestion}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
      STORES_SERVICE_URL: http://agiliz-stores-prod:3000
      PRODUCTS_SERVICE_URL: http://agiliz-products-prod:3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-agiliz}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-agiliz-dev-secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-agiliz-uploads}
      AWS_S3_ENDPOINT: http://agiliz-minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingestion-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/ingestion-worker-service/Dockerfile
      target: runtime
    container_name: agiliz-ingestion-prod
    depends_on:
      ingestion-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${INGESTION_POSTGRES_USER:-agiliz}:${INGESTION_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-ingestion-postgres:5432/${INGESTION_POSTGRES_DB:-ingestion}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
      STORES_SERVICE_URL: http://agiliz-stores-prod:3000
      PRODUCTS_SERVICE_URL: http://agiliz-products-prod:3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-agiliz}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-agiliz-dev-secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-agiliz-uploads}
      AWS_S3_ENDPOINT: http://agiliz-minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
