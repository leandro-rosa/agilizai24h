networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_billing_postgres_data:
    name: agiliz_billing_postgres_data

services:
  # Database-per-service: this Postgres belongs to billing-service alone. No other
  # service reads these tables.
  billing-postgres:
    image: postgres:16-alpine
    container_name: agiliz-billing-postgres
    environment:
      POSTGRES_USER: ${BILLING_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${BILLING_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${BILLING_POSTGRES_DB:-billing}
    ports:
      - "${BILLING_POSTGRES_HOST_PORT:-5444}:5432"
    volumes:
      - agiliz_billing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BILLING_POSTGRES_USER:-agiliz} -d ${BILLING_POSTGRES_DB:-billing}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  billing-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/billing-service/Dockerfile
      target: dev
    container_name: agiliz-billing-dev
    depends_on:
      billing-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${BILLING_POSTGRES_USER:-agiliz}:${BILLING_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-billing-postgres:5432/${BILLING_POSTGRES_DB:-billing}
      PORT: 3000
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  billing-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/billing-service/Dockerfile
      target: runtime
    container_name: agiliz-billing-prod
    depends_on:
      billing-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${BILLING_POSTGRES_USER:-agiliz}:${BILLING_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-billing-postgres:5432/${BILLING_POSTGRES_DB:-billing}
      PORT: 3000
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
