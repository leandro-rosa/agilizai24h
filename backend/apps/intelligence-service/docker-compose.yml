networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_intelligence_postgres_data:
    name: agiliz_intelligence_postgres_data

services:
  # Database-per-service: this Postgres belongs to intelligence-service alone. No other
  # service reads these tables.
  intelligence-postgres:
    image: postgres:16-alpine
    container_name: agiliz-intelligence-postgres
    environment:
      POSTGRES_USER: ${INTELLIGENCE_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${INTELLIGENCE_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${INTELLIGENCE_POSTGRES_DB:-intelligence}
    ports:
      - "${INTELLIGENCE_POSTGRES_HOST_PORT:-5446}:5432"
    volumes:
      - agiliz_intelligence_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INTELLIGENCE_POSTGRES_USER:-agiliz} -d ${INTELLIGENCE_POSTGRES_DB:-intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  intelligence-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/intelligence-service/Dockerfile
      target: dev
    container_name: agiliz-intelligence-dev
    depends_on:
      intelligence-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${INTELLIGENCE_POSTGRES_USER:-agiliz}:${INTELLIGENCE_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-intelligence-postgres:5432/${INTELLIGENCE_POSTGRES_DB:-intelligence}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
      SALES_SERVICE_URL: http://agiliz-sales-dev:3000
      SUPPLY_SERVICE_URL: http://agiliz-supply-dev:3000
      PRODUCTS_SERVICE_URL: http://agiliz-products-dev:3000
      STORES_SERVICE_URL: http://agiliz-stores-dev:3000
      SUPPLIERS_SERVICE_URL: http://agiliz-suppliers-dev:3000
      TREASURY_SERVICE_URL: http://agiliz-treasury-dev:3000
      ACCOUNTING_SERVICE_URL: http://agiliz-accounting-dev:3000
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  intelligence-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/intelligence-service/Dockerfile
      target: runtime
    container_name: agiliz-intelligence-prod
    depends_on:
      intelligence-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${INTELLIGENCE_POSTGRES_USER:-agiliz}:${INTELLIGENCE_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-intelligence-postgres:5432/${INTELLIGENCE_POSTGRES_DB:-intelligence}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
      SALES_SERVICE_URL: http://agiliz-sales-prod:3000
      SUPPLY_SERVICE_URL: http://agiliz-supply-prod:3000
      PRODUCTS_SERVICE_URL: http://agiliz-products-prod:3000
      STORES_SERVICE_URL: http://agiliz-stores-prod:3000
      SUPPLIERS_SERVICE_URL: http://agiliz-suppliers-prod:3000
      TREASURY_SERVICE_URL: http://agiliz-treasury-prod:3000
      ACCOUNTING_SERVICE_URL: http://agiliz-accounting-prod:3000
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
