networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_products_postgres_data:
    name: agiliz_products_postgres_data

services:
  # Database-per-service: this Postgres belongs to products-service alone. No other
  # service reads these tables.
  products-postgres:
    image: postgres:16-alpine
    container_name: agiliz-products-postgres
    environment:
      POSTGRES_USER: ${PRODUCTS_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${PRODUCTS_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${PRODUCTS_POSTGRES_DB:-products}
    ports:
      - "${PRODUCTS_POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - agiliz_products_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCTS_POSTGRES_USER:-agiliz} -d ${PRODUCTS_POSTGRES_DB:-products}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  products-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/products-service/Dockerfile
      target: dev
    container_name: agiliz-products-dev
    depends_on:
      products-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PRODUCTS_POSTGRES_USER:-agiliz}:${PRODUCTS_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-products-postgres:5432/${PRODUCTS_POSTGRES_DB:-products}
      PORT: 3000
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  products-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/products-service/Dockerfile
      target: runtime
    container_name: agiliz-products-prod
    depends_on:
      products-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PRODUCTS_POSTGRES_USER:-agiliz}:${PRODUCTS_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-products-postgres:5432/${PRODUCTS_POSTGRES_DB:-products}
      PORT: 3000
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
