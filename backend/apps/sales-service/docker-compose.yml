networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_sales_postgres_data:
    name: agiliz_sales_postgres_data

services:
  # Database-per-service: this Postgres belongs to sales-service alone. No other
  # service reads these tables.
  sales-postgres:
    image: postgres:16-alpine
    container_name: agiliz-sales-postgres
    environment:
      POSTGRES_USER: ${SALES_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${SALES_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${SALES_POSTGRES_DB:-sales}
    ports:
      - "${SALES_POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - agiliz_sales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SALES_POSTGRES_USER:-agiliz} -d ${SALES_POSTGRES_DB:-sales}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  sales-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/sales-service/Dockerfile
      target: dev
    container_name: agiliz-sales-dev
    depends_on:
      sales-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SALES_POSTGRES_USER:-agiliz}:${SALES_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-sales-postgres:5432/${SALES_POSTGRES_DB:-sales}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sales-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/sales-service/Dockerfile
      target: runtime
    container_name: agiliz-sales-prod
    depends_on:
      sales-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SALES_POSTGRES_USER:-agiliz}:${SALES_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-sales-postgres:5432/${SALES_POSTGRES_DB:-sales}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
