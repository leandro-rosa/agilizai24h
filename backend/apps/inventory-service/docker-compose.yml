networks:
  agiliz_network:
    external: true
    name: agiliz_network

volumes:
  agiliz_inventory_postgres_data:
    name: agiliz_inventory_postgres_data

services:
  # Database-per-service: this Postgres belongs to inventory-service alone. No other
  # service reads these tables.
  inventory-postgres:
    image: postgres:16-alpine
    container_name: agiliz-inventory-postgres
    environment:
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-agiliz}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:-agiliz-dev-secret}
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventory}
    ports:
      - "${INVENTORY_POSTGRES_HOST_PORT:-5439}:5432"
    volumes:
      - agiliz_inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER:-agiliz} -d ${INVENTORY_POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agiliz_network

  inventory-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there.
      context: ../../..
      dockerfile: backend/apps/inventory-service/Dockerfile
      target: dev
    container_name: agiliz-inventory-dev
    depends_on:
      inventory-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${INVENTORY_POSTGRES_USER:-agiliz}:${INVENTORY_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-inventory-postgres:5432/${INVENTORY_POSTGRES_DB:-inventory}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
      SALES_SERVICE_URL: http://agiliz-sales-prod:3000
      SUPPLY_SERVICE_URL: http://agiliz-supply-prod:3000
    # No published host port: domain services stay internal to agiliz_network,
    # reachable only through gateway-service.
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explicitly — Alpine resolves localhost to ::1 first.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  inventory-prod:
    build:
      context: ../../..
      dockerfile: backend/apps/inventory-service/Dockerfile
      target: runtime
    container_name: agiliz-inventory-prod
    depends_on:
      inventory-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${INVENTORY_POSTGRES_USER:-agiliz}:${INVENTORY_POSTGRES_PASSWORD:-agiliz-dev-secret}@agiliz-inventory-postgres:5432/${INVENTORY_POSTGRES_DB:-inventory}
      PORT: 3000
      REDIS_QUEUE_HOST: agiliz-redis
      REDIS_QUEUE_PORT: 6379
      # Unset would default to TRUE in @app/hold-it and crash NestJS at startup.
      WITH_KAFKA_BROKERS: "false"
      SALES_SERVICE_URL: http://agiliz-sales-prod:3000
      SUPPLY_SERVICE_URL: http://agiliz-supply-prod:3000
    expose:
      - "3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
