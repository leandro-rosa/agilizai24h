packages:
  - "backend/apps/*"
  - "backend/common/nest-libs/*"
  - "frontend/apps/*"
  - "frontend/common/*"

# pnpm 11 blocks dependency build scripts unless they are explicitly allowed.
# All below are native/codegen postinstalls from first-party toolchains we
# already depend on: Tailwind v4 and Vite/esbuild for the frontends, and
# protobuf/msgpack codecs pulled in by the OpenTelemetry and BullMQ stacks.
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  "@tailwindcss/oxide": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

# Written by pnpm: these versions are newer than the default minimum-release-age
# gate, and were accepted when this workspace was first installed.
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1112.0"
  - "@bull-board/api@9.2.0"
  - "@bull-board/fastify@9.2.0"
  - "@bull-board/ui@9.2.0"
