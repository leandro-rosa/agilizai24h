networks:
  agiliz_network:
    external: true

services:
  admin-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there, so the build
      # cannot be scoped to this folder.
      context: ../../..
      dockerfile: frontend/apps/admin/Dockerfile
      target: dev
    container_name: agiliz-admin-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/repo/frontend/apps/admin
      # Keep the image's installed dependencies and build cache; the bind mount
      # above would otherwise hide them behind the host folder.
      - /repo/frontend/apps/admin/node_modules
      - /repo/frontend/apps/admin/.next
      - /repo/node_modules
    environment:
      - WATCHPACK_POLLING=true
      # `next dev` re-reads process.env on every compile, so this can stay a
      # normal runtime var here — unlike admin-prod, which bakes it into the
      # standalone bundle at build time (see that service's build.args).
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:3080}
    networks:
      - agiliz_network
    restart: unless-stopped

  admin-prod:
    build:
      context: ../../..
      dockerfile: frontend/apps/admin/Dockerfile
      target: prod
      # NEXT_PUBLIC_* vars are inlined into the client bundle by `next build`
      # (Next has no client-side runtime env) — setting this as `environment:`
      # instead would have no effect on prod; the container would keep
      # whatever URL was baked in at image build time.
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:3080}
    container_name: agiliz-admin-prod
    ports:
      - "8080:3000"
    networks:
      - agiliz_network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: Alpine's wget resolves localhost to ::1 first,
      # and Next only listens on IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
