networks:
  agiliz_network:
    external: true

services:
  site-dev:
    build:
      # Repo root: the pnpm workspace keeps one lockfile there, so the build
      # cannot be scoped to this folder.
      context: ../../..
      dockerfile: frontend/apps/site/Dockerfile
      target: dev
    container_name: agiliz-site-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/repo/frontend/apps/site
      # Keep the image's installed dependencies; the bind mount above would
      # otherwise hide them behind the host folder.
      - /repo/frontend/apps/site/node_modules
      - /repo/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - agiliz_network
    restart: unless-stopped

  site-prod:
    build:
      context: ../../..
      dockerfile: frontend/apps/site/Dockerfile
      target: prod
    container_name: agiliz-site-prod
    ports:
      - "80:80"
    networks:
      - agiliz_network
    restart: unless-stopped

    healthcheck:
      # 127.0.0.1, not localhost: Alpine's wget resolves localhost to ::1 first.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
