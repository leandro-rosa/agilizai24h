networks:
  agiliz_network:
    external: true

services:
  site-dev:
    build:
      context: .
      target: dev
    container_name: agiliz-site-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - agiliz_network
    restart: unless-stopped

  site-prod:
    build:
      context: .
      target: prod
    container_name: agiliz-site-prod
    ports:
      - "80:80"
    networks:
      - agiliz_network
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s